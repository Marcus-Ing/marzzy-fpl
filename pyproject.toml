[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-analyzer"
version = "0.5.0"
description = "Fantasy Premier League helper — squad, analysis, transfers, Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "streamlit>=1.28",
]

[project.scripts]
fpl-analyzer = "fpl_analyzer.main:main"

[tool.setuptools.packages.find]
include = ["fpl_analyzer*"]
